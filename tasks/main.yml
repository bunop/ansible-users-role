---
# tasks file for ansible-users-role

# root.yml and users.yml both use become_user (dotfiles, .ssh setup). Ansible needs
# setfacl (not plain chmod) to grant a become_user with no shared group access to its
# temp files, otherwise become fails with a chmod ACL syntax error on a fresh host.
- name: Install acl for become_user support
  apt:
    name: acl
    update_cache: yes
    cache_valid_time: 3600

# install for root user
- import_tasks: root.yml

# install all other users
- import_tasks: users.yml
  when:
    - users is defined
    - users|length > 0

# check and install miniconda
- name: check for installation of Miniconda
  stat:
    path: '{{  miniconda_conda_bin  }}'
  changed_when: false
  register: miniconda_conda_binary

- import_tasks: miniconda.yml
  when: miniconda_conda_binary.stat.exists
